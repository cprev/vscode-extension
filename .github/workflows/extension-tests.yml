name: Extension build and host integration
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extension-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run compilation, strict lint, and the pinned real VS Code host
        run: xvfb-run -a npm test
      - name: Require generated JavaScript to match source
        run: git diff --exit-code -- out
